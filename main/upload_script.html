<style>
    progress {
        width: 100%;
        -webkit-appearance: none;
        appearance: none;
    }

    progress::-webkit-progress-bar {
        background-color: #f3f3f3;
    }

    progress::-webkit-progress-value {
        background-color: blue;
    }

    progress::-moz-progress-bar {
        background-color: blue;
    }
</style>

<table class="fixed" border="0">
    <tr>
        <td colspan="2">
            <input id="newfile" type="file" onchange="setpath()" style="width:100%;">
        </td>
        <td>
            <input id="filepath" type="text" style="width:100%;">
        </td>
        <td>
            <button id="upload" type="button" onclick="upload()">Start!!</button>
        </td>
    </tr>
    <tr>
        <td colspan="4">
            <progress id="progressBar" value="0" max="100" style="width:100%;"></progress>
            <span id="status"></span>
        </td>
    </tr>
</table>

<script>
function setpath() {
    var default_path = document.getElementById("newfile").files[0].name;
    document.getElementById("filepath").value = default_path;
}

function upload() {
    var filePath = document.getElementById("filepath").value;
    var upload_path = "/upload/" + filePath;
    var fileInput = document.getElementById("newfile").files;

    var MAX_FILE_SIZE = 1572864;
    var MAX_FILE_SIZE_STR = "1536KB";

    if (fileInput.length == 0) {
        alert("No file selected!");
    } else if (filePath.length == 0) {
        alert("File path on server is not set!");
    } else if (filePath.indexOf(' ') >= 0) {
        alert("File path on server cannot have spaces!");
    } else if (filePath[filePath.length-1] == '/') {
        alert("File name not specified after path!");
    } else if (fileInput[0].size > 1572864) {
        alert("File size must be less than 1536KB!");
    } else {
        document.getElementById("newfile").disabled = true;
        document.getElementById("filepath").disabled = true;
        document.getElementById("upload").disabled = true;

        var file = fileInput[0];
        var xhttp = new XMLHttpRequest();
        
        xhttp.upload.addEventListener("progress", function(event) {
            if (event.lengthComputable) {
                var percentComplete = (event.loaded / event.total) * 100;
                document.getElementById("progressBar").value = percentComplete;
                document.getElementById("status").innerText = Math.round(percentComplete) + "% uploaded";
            }
        });

        xhttp.onreadystatechange = function() {
            if (xhttp.readyState == 4) {
                if (xhttp.status == 200) {
                    document.open();
                    document.write(xhttp.responseText);
                    document.close();
                } else if (xhttp.status == 0) {
                    <!-- alert("Server closed the connection abruptly!"); -->
                    location.reload()
                } else {
                    alert(xhttp.status + " Error!\n" + xhttp.responseText);
                    location.reload()
                }
            }
        };

        xhttp.open("POST", upload_path, true);
        xhttp.send(file);
    }
}
</script>
